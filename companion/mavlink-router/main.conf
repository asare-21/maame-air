# mavlink-router on the Maame Pi: owns the FC serial link and fans it out.
# Install as /etc/mavlink-router/main.conf.

[General]
# GCS fallback over TCP (ArduDeck: TCP maame.local:5760)
TcpServerPort = 5760
ReportStats = false

# Kakute H7 UART1 (SERIAL1: MAVLink2, 921600) via J25
[UartEndpoint fc]
Device = /dev/serial0
Baud = 921600

# maame companion service (LEDs, Pi gate heartbeat): --device udpin:127.0.0.1:14551
[UdpEndpoint companion]
Mode = Normal
Address = 127.0.0.1
Port = 14551

# Ground station over Wi-Fi (known network or Pi hotspot); GCS connects as UDP client to maame.local:14550
[UdpEndpoint gcs]
Mode = Server
Address = 0.0.0.0
Port = 14550
